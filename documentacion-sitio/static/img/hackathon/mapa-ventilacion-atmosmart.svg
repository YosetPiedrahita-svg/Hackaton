<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="system-ui,Segoe UI,Roboto,sans-serif">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#38bdf8"/></marker></defs>
<rect width="960" height="440" rx="16" fill="#0b1220"/>
<line x1="30" y1="70" x2="930" y2="70" stroke="#22c55e" stroke-width="3"/>
<text x="36" y="58" fill="#22c55e" font-size="12" font-weight="700">SUPERFICIE</text>
<text x="36" y="150" fill="#6b7891" font-size="12">Nivel 1</text>
<text x="36" y="330" fill="#6b7891" font-size="12">Nivel 2</text>

<!-- galerías -->
<g stroke="#26334f" stroke-width="22" stroke-linecap="round" fill="none">
<path d="M130 100 L260 160 L560 160"/>
<path d="M260 160 L400 300"/>
<path d="M400 300 L830 300"/>
<path d="M830 300 L830 100"/>
<path d="M120 330 L400 300"/>
</g>
<!-- flujo aire fresco -->
<g stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a)">
<path d="M130 100 L250 155"/>
<path d="M270 165 L392 292"/>
<path d="M410 300 L600 300"/>
</g>
<!-- retorno -->
<g stroke="#f5b301" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a)">
<path d="M760 300 L822 300"/>
<path d="M830 280 L830 110"/>
</g>

<!-- nodos -->
<g fill="#22c55e"><circle cx="130" cy="100" r="9"/><circle cx="260" cy="160" r="9"/><circle cx="560" cy="160" r="9"/><circle cx="400" cy="300" r="9"/><circle cx="640" cy="300" r="9"/><circle cx="120" cy="330" r="9"/></g>
<g fill="#6b7891"><circle cx="830" cy="300" r="9"/><circle cx="830" cy="110" r="9"/></g>
<text x="130" y="84" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Bocamina</text>
<text x="260" y="190" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Galería N1</text>
<text x="560" y="190" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Frente de explotación 1</text>
<text x="360" y="240" fill="#fff" font-size="13" font-weight="700" text-anchor="end">Inclinado / tambor</text>
<text x="400" y="332" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Galería N2</text>
<text x="640" y="332" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Frente de explotación 2</text>
<text x="120" y="362" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Estación de bombeo</text>
<text x="800" y="200" fill="#fff" font-size="13" font-weight="700" text-anchor="end">Chimenea de retorno</text>
<text x="830" y="332" fill="#9aa6bd" font-size="12" text-anchor="middle">Galería de retorno N2</text>

<!-- VA / VP -->
<g><circle cx="410" cy="160" r="13" fill="#fff"/><text x="410" y="165" font-size="12" font-weight="800" fill="#0b1220" text-anchor="middle">VA</text>
<circle cx="560" cy="300" r="13" fill="#fff"/><text x="560" y="305" font-size="12" font-weight="800" fill="#0b1220" text-anchor="middle">VA</text>
<rect x="808" y="52" width="44" height="26" rx="8" fill="#f5b301"/><text x="830" y="70" font-size="13" font-weight="800" fill="#0b1220" text-anchor="middle">VP</text></g>

<!-- leyenda -->
<g font-size="12" fill="#c9d4ea">
<line x1="40" y1="400" x2="76" y2="400" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 5"/><text x="84" y="404">Aire fresco</text>
<line x1="180" y1="400" x2="216" y2="400" stroke="#f5b301" stroke-width="2" stroke-dasharray="6 5"/><text x="224" y="404">Aire viciado (retorno)</text>
<text x="400" y="404">VA: ventilación auxiliar con manga en labores ciegas · VP: ventilador principal</text>
</g>
</svg>
